name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create backend environment
        run: cp backend/.env.example backend/.env

      - name: Build containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Install backend dependencies
        run: docker compose exec -T backend npm ci

      - name: Install frontend dependencies
        run: docker compose exec -T frontend npm ci
      - name: Diagnose test environment
        run: |
          docker compose exec -T backend pwd
          docker compose exec -T backend ls -la .env.test
          docker compose exec -T backend cat .env.test
          docker compose exec -T backend npm ls dotenv-cli
          docker compose exec -T backend ./node_modules/.bin/dotenv --version

      - name: Migrate test database
        run: docker compose exec -T backend npm run db:test:migrate

      - name: Build backend
        run: docker compose exec -T backend npm run build

      - name: Test backend
        run: docker compose exec -T backend npm test

      - name: Build frontend
        run: docker compose exec -T frontend npm run build

      - name: Test frontend
        run: docker compose exec -T frontend npm test
